name: Anizium Scraper

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir çalışır
  workflow_dispatch: # Elle tetiklemek için

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install DrissionPage requests

      - name: Run Scraper
        # Sanal ekran (xvfb) içinde main.py çalıştırılır
        run: xvfb-run python main.py

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: ./*.jpg
          retention-days: 1

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Dosyalar yoksa oluştur (hata vermemesi için)
          touch anizium.m3u anizium.json
          
          git add anizium.m3u anizium.json
          
          # Eğer değişiklik varsa commit yap, yoksa hata verme
          git diff-index --quiet HEAD || git commit -m "Playlist Guncellendi [Otomatik]"
          git push
